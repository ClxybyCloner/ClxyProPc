name: Build Windows Portable

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    name: Build ClxyPro for Windows (Portable)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history + tags: the changelog step diffs against the
          # previous version tag.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 1.27: the core module needs 1.27.2 and the psiphon wrapper
          # module needs 1.26.0. (Was 1.23: it only worked because the
          # toolchain auto-downloaded a newer one on every run.)
          go-version: '1.27'
          cache: true
          cache-dependency-path: core/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      # Scoped to the config, service and psiphon packages: the rest of
      # the suite needs live network access or Windows-only behavior.
      # The psiphon package is pure (config + supervisor + probe).
      - name: Test Go core
        working-directory: core
        run: go test -count=1 ./internal/aether/ ./internal/config/ ./internal/service/ ./internal/psiphon/

      - name: Build Windows Portable Package
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClxyPro-Windows-x64
          path: dist/*.zip
          if-no-files-found: error

      # generate_release_notes only emits the compare link when there
      # are no merged PRs — the update dialog then shows no changes
      # at all. Build the notes from this version's commit subjects.
      - name: Build changelog
        if: startsWith(github.ref, 'refs/tags/')
        id: changelog
        shell: pwsh
        run: |
          $tags = git tag --sort=-v:refname | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' }
          $prev = $tags | Select-Object -Skip 1 -First 1
          if ($prev) {
            $log = git log "$prev..HEAD" --format='- %s'
            $compare = "https://github.com/$env:GITHUB_REPOSITORY/compare/$prev...$env:GITHUB_REF_NAME"
          } else {
            $log = git log --format='- %s'
            $compare = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:GITHUB_REF_NAME"
          }
          $body = ($log -join "`n") + "`n`n**Full Changelog**: $compare"
          Add-Content -Path $env:GITHUB_OUTPUT -Value 'body<<EOF'
          Add-Content -Path $env:GITHUB_OUTPUT -Value $body
          Add-Content -Path $env:GITHUB_OUTPUT -Value 'EOF'

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: ${{ steps.changelog.outputs.body }}
          fail_on_unmatched_files: true

      - name: Refresh Latest Release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (Rolling)
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Rolling build for Windows Portable from commit `${{ github.sha }}` on `${{ github.ref_name }}`.
            Download the zip, extract anywhere, and run `ClxyPro.exe`.
          files: dist/*.zip
