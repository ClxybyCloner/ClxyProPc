name: Build Windows Portable

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    name: Build ClxyPro for Windows (Portable)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: core/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      # Scoped to the config and service packages: the rest of the suite
      # needs live network access or Windows-only behavior.
      - name: Test Go core
        working-directory: core
        run: go test -count=1 ./internal/config/ ./internal/service/

      - name: Build Windows Portable Package
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClxyPro-Windows-x64
          path: dist/*.zip
          if-no-files-found: error

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Refresh Latest Release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (Rolling)
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Rolling build for Windows Portable from commit `${{ github.sha }}` on `${{ github.ref_name }}`.
            Download the zip, extract anywhere, and run `ClxyPro.exe`.
          files: dist/*.zip
